# Diagnostic lane: the same program at a lower effort level with no candidate
# search. This compiler renames no properties, so extern keys keep their names
# here too; the lane no longer differs from the npm file in what it mangles.
[javascript]
priority = "size-first"
optimization_level = 12
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "off"

[mangle]
identifiers = true
properties = true
pool_strings = true
